name: P6 GitHub token normalize
description: Normalize and validate GitHub tokens, returning one canonical token

inputs:
  preferred-token:
    description: First-choice token
    required: false
  fallback-token:
    description: Second-choice token
    required: false
  default-token:
    description: Third-choice token (typically github.token)
    required: false

outputs:
  value:
    description: Normalized, selected token value
    value: ${{ steps.pick.outputs.value }}
  source:
    description: Which input won (preferred|fallback|default|none)
    value: ${{ steps.pick.outputs.source }}

runs:
  using: composite
  steps:
    - name: Select token
      id: pick
      shell: bash
      env:
        PREFERRED_TOKEN: ${{ inputs.preferred-token }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token }}
        DEFAULT_TOKEN: ${{ inputs.default-token }}
      run: |
        sanitize() {
          local t="$1"
          t="${t#https://x-access-token:}"
          t="${t#x-access-token:}"
          t="${t%@github.com*}"
          printf '%s' "$t"
        }

        preferred="$(sanitize "${PREFERRED_TOKEN}")"
        fallback="$(sanitize "${FALLBACK_TOKEN}")"
        def="$(sanitize "${DEFAULT_TOKEN}")"

        if [[ -n "${preferred}" ]]; then
          echo "value=${preferred}" >> "$GITHUB_OUTPUT"
          echo "source=preferred" >> "$GITHUB_OUTPUT"
        elif [[ -n "${fallback}" ]]; then
          echo "value=${fallback}" >> "$GITHUB_OUTPUT"
          echo "source=fallback" >> "$GITHUB_OUTPUT"
        elif [[ -n "${def}" ]]; then
          echo "value=${def}" >> "$GITHUB_OUTPUT"
          echo "source=default" >> "$GITHUB_OUTPUT"
        else
          echo "value=" >> "$GITHUB_OUTPUT"
          echo "source=none" >> "$GITHUB_OUTPUT"
        fi
